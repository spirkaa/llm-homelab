      --no-mmap
      --parallel 1
      --threads 8
      -rtr
      -ctk q8_0
      -ctv q8_0
      -ub 4096
      -b 4096
      -ngl 99
      -ot exps=CPU
      --ctx-size 131072
      --temp 0.6
      --min-p 0
