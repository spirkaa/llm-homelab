# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

# https://github.com/mostlygeek/llama-swap/wiki/Configuration
# https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md

healthCheckTimeout: 300
logLevel: info
sendLoadingState: true
includeAliasesInList: true

macros:
  macros-docker-proxy: http://host.docker.internal:${PORT}
  macros-docker-stop: docker stop model-${MODEL_ID}
  macros-docker-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/llama.cpp:server-cuda
  macros-docker-llama-no-gpu: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/llama.cpp:server-cuda
  macros-docker-ik-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/ik_llama.cpp:server-cuda

groups:
  forever:
    persistent: true
    swap: false
    exclusive: false
    members:
      - qwen3.5-0.8b

models:
  gemma-3-27b-it-qat:
    # https://unsloth.ai/docs/models/gemma-3-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/gemma-3-27b-it-q4_0.gguf
      --metrics
      --mlock
      --fit-target 2048
      --mmproj /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/mmproj-model-f16-27B.gguf
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 64

  gpt-oss-120b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-120b-GGUF/gpt-oss-120b-UD-Q4_K_XL-00001-of-00002.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 26
      --jinja
      --grammar-file /app/config/gpt-oss-vscode.gbnf
    aliases:
      - gpt-oss-120b:high
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 1.0
        top_k: 0.0
        chat_template_kwargs:
          reasoning_effort: medium
      setParamsByID:
        "${MODEL_ID}:high":
          chat_template_kwargs:
            reasoning_effort: high

  gpt-oss-20b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
      --metrics
      --mlock
      --jinja
      --grammar-file /app/config/gpt-oss-vscode.gbnf
    aliases:
      - gpt-oss-20b:high
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 1.0
        top_k: 0.0
        chat_template_kwargs:
          reasoning_effort: medium
      setParamsByID:
        "${MODEL_ID}:high":
          chat_template_kwargs:
            reasoning_effort: high

  qwen3-coder-30b-a3b-instruct:
    # https://unsloth.ai/docs/models/qwen3-coder-how-to-run-locally
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20
        repetition_penalty: 1.05

  qwen3-30b-a3b-instruct-2507:
    # https://unsloth.ai/docs/models/qwen3-how-to-run-and-fine-tune/qwen3-2507
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF/Qwen3-30B-A3B-Instruct-2507-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20

  qwen3-vl-32b:
    # https://unsloth.ai/docs/models/qwen3-how-to-run-and-fine-tune/qwen3-vl-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-VL-32B-Instruct-GGUF/Qwen3-VL-32B-Instruct-UD-Q3_K_XL.gguf
      --metrics
      --mlock
