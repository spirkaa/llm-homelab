  qwen3-next-80b-a3b-instruct:
    # https://unsloth.ai/docs/models/tutorials/qwen3-next
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-Next-80B-A3B-Instruct-GGUF/Qwen3-Next-80B-A3B-Instruct-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 26
      --ctx-size 65536
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.0

  qwen3-coder-next-80b-a3b:
    # https://unsloth.ai/docs/models/qwen3-coder-next
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 29
      --ctx-size 100000
      --jinja
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.01
        top_p: 0.95
        top_k: 40

  qwen3.5-0.8b:
    # https://unsloth.ai/docs/models/qwen3.5
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama-no-gpu}
      --model /app/models/unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q8_0.gguf
      --metrics
      --mlock
      --ctx-size 32768
      --threads 8
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  qwen3.5-27b:
