# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

# https://github.com/mostlygeek/llama-swap/wiki/Configuration
# https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md

healthCheckTimeout: 300
logLevel: info
sendLoadingState: true
includeAliasesInList: true

macros:
  macros-docker-proxy: http://host.docker.internal:${PORT}
  macros-docker-stop: docker stop model-${MODEL_ID}
  macros-docker-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/llama.cpp:server-cuda
  macros-docker-llama-no-gpu: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/llama.cpp:server-cuda
  macros-docker-ik-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /mnt/data0/llm/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/ik_llama.cpp:server-cuda

groups:
  forever:
    persistent: true
    swap: false
    exclusive: false
    members:
      - qwen3.5-0.8b

models:
  gemma-3-27b-it-qat:
    # https://unsloth.ai/docs/models/gemma-3-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/gemma-3-27b-it-q4_0.gguf
      --metrics
      --mlock
      --fit-target 2048
      --mmproj /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/mmproj-model-f16-27B.gguf
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 64

  gemma-4-26b-a4b:
    # https://unsloth.ai/docs/models/gemma-4
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --fit-target 1536
      --fit-ctx 131072
      --batch-size 2048
      --ubatch-size 2048
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 48
      --mmproj /app/models/unsloth/gemma-4-26B-A4B-it-GGUF/mmproj-F16.gguf
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 64

  gemma-4-31b:
    # https://unsloth.ai/docs/models/gemma-4
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gemma-4-31B-it-GGUF/gemma-4-31B-it-IQ4_XS.gguf
      --metrics
      --mlock
      --fit-target 1536
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 48
      --mmproj /app/models/unsloth/gemma-4-31B-it-GGUF/mmproj-F16.gguf
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 64

  gpt-oss-120b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-120b-GGUF/gpt-oss-120b-UD-Q4_K_XL-00001-of-00002.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 26
      --jinja
      --grammar-file /app/config/gpt-oss-vscode.gbnf
    aliases:
      - gpt-oss-120b:high
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 1.0
        top_k: 0.0
        chat_template_kwargs:
          reasoning_effort: medium
      setParamsByID:
        "${MODEL_ID}:high":
          chat_template_kwargs:
            reasoning_effort: high

  gpt-oss-20b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
      --metrics
      --mlock
      --jinja
      --grammar-file /app/config/gpt-oss-vscode.gbnf
    aliases:
      - gpt-oss-20b:high
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 1.0
        top_k: 0.0
        chat_template_kwargs:
          reasoning_effort: medium
      setParamsByID:
        "${MODEL_ID}:high":
          chat_template_kwargs:
            reasoning_effort: high

  qwen3-next-80b-a3b-instruct:
    # https://unsloth.ai/docs/models/tutorials/qwen3-next
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-Next-80B-A3B-Instruct-GGUF/Qwen3-Next-80B-A3B-Instruct-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 27
      --fit-ctx 65536
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.0

  qwen3-coder-next-80b-a3b:
    # https://unsloth.ai/docs/models/qwen3-coder-next
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 30
      --fit-ctx 65536
      --jinja
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.01
        top_p: 0.95
        top_k: 40

  qwen3.5-0.8b:
    # https://unsloth.ai/docs/models/qwen3.5
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama-no-gpu}
      --model /app/models/unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q8_0.gguf
      --metrics
      --mlock
      --ctx-size 32768
      --threads 8
      --jinja
    filters:
      setParams:
        temperature: 0.7
        min_p: 0.0
        top_p: 0.8
        top_k: 20
        presence_penalty: 1.5
        chat_template_kwargs:
          enable_thinking: false

  qwen3.5-122b-a10b:
    # https://unsloth.ai/docs/models/qwen3.5
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/AesSedai/Qwen3.5-122B-A10B-GGUF/Qwen3.5-122B-A10B-IQ4_XS-00001-of-00003.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 34
      --fit-target 256
      --parallel 1
      --jinja
    aliases:
      - qwen3.5-122b-a10b:coding
      - qwen3.5-122b-a10b:instruct
      - qwen3.5-122b-a10b:instruct-reasoning
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
      setParamsByID:
        "${MODEL_ID}:coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:instruct-reasoning":
          chat_template_kwargs:
            enable_thinking: false

  qwen3.6-27b:
    # https://unsloth.ai/docs/models/qwen3.6
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3.6-27B-GGUF/Qwen3.6-27B-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --fit-target 1536
      --fit-ctx 65536
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 48
      --jinja
      --mmproj /app/models/unsloth/Qwen3.6-27B-GGUF/mmproj-F16.gguf
    aliases:
      - qwen3.6-27b:coding
      - qwen3.6-27b:instruct
      - qwen3.6-27b:instruct-reasoning
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
        chat_template_kwargs:
          preserve_thinking: true
      setParamsByID:
        "${MODEL_ID}:coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: false
        "${MODEL_ID}:instruct-reasoning":
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: false

  qwen3.6-35b-a3b:
    # https://unsloth.ai/docs/models/qwen3.6
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
      --metrics
      --mlock
      --fit-target 256
      --fit-ctx 100000
      --batch-size 2048
      --ubatch-size 2048
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 12
      --spec-ngram-mod-n-max 48
      --jinja
    aliases:
      - qwen3.6-35b-a3b:coding
      - qwen3.6-35b-a3b:instruct
      - qwen3.6-35b-a3b:instruct-reasoning
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
        chat_template_kwargs:
          preserve_thinking: true
      setParamsByID:
        "${MODEL_ID}:coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: false
        "${MODEL_ID}:instruct-reasoning":
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: false

  glm-4.5-air-iq4-kss:
    # https://huggingface.co/ubergarm/GLM-4.5-Air-GGUF
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-ik-llama}
      --model /app/models/ubergarm/GLM-4.5-Air-GGUF/GLM-4.5-Air-IQ4_KSS-00001-of-00002.gguf
      --metrics
      --no-mmap
      --parallel 1
      --threads 8
      -rtr
      -ctk q8_0
      -ctv q8_0
      -ub 4096
      -b 4096
      -ngl 99
      -ot exps=CPU
      --ctx-size 131072
      --temp 0.6
      --min-p 0
      --top-p 0.95
      --top-k 40
      --chat-template chatglm4

  glm-4.7-flash-30b-a3b:
    # https://unsloth.ai/docs/models/glm-4.7-flash
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/GLM-4.7-Flash-GGUF/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --fit-target 256
      --batch-size 2048
      --ubatch-size 2048
      --parallel 1
      --jinja
    aliases:
      - glm-4.7-flash-30b-a3b:tools
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.01
        top_p: 0.95
      setParamsByID:
        "${MODEL_ID}:tools":
          temperature: 0.7
          top_p: 1.0

  nvidia-nemotron-3-nano-30b-a3b:
    # https://unsloth.ai/docs/models/tutorials/nemotron-3
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Nemotron-3-Nano-30B-A3B-GGUF/Nemotron-3-Nano-30B-A3B-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --fit-target 256
      --parallel 1
      --jinja
    aliases:
      - nvidia-nemotron-3-nano-30b-a3b:tools
    filters:
      setParams:
        temperature: 1.0
        top_p: 1.0
      setParamsByID:
        "${MODEL_ID}:tools":
          temperature: 0.6
          top_p: 0.95

  nvidia-nemotron-3-super-120b-a12b:
    # https://unsloth.ai/docs/models/nemotron-3-super
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/AesSedai/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF/NVIDIA-Nemotron-3-Super-120B-A12B-BF16-IQ4_XS-00001-of-00003.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 68
      --fit-target 256
      --parallel 1
      --jinja
    aliases:
      - nvidia-nemotron-3-super-120b-a12b:tools
    filters:
      setParams:
        temperature: 1.0
        top_p: 1.0
      setParamsByID:
        "${MODEL_ID}:tools":
          temperature: 0.6
          top_p: 0.95
