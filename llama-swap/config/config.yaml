  glm-4.5-air-iq4-kss:
    # https://huggingface.co/ubergarm/GLM-4.5-Air-GGUF
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-ik-llama}
      --model /app/models/ubergarm/GLM-4.5-Air-GGUF/GLM-4.5-Air-IQ4_KSS-00001-of-00002.gguf
