    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
      setParamsByID:
        "${MODEL_ID}:coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
