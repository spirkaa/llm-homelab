      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 28
      --batch-size 4096
      --ubatch-size 2048
      --ctx-size 45000
      --temp 0.7
      --min-p 0.0
      --top-p 0.8
      --top-k 20
      --presence-penalty 1.0
      --jinja

  qwen3-coder-next-80b-a3b:
