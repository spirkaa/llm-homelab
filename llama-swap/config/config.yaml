# https://github.com/mostlygeek/llama-swap/wiki/Configuration
# https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md

healthCheckTimeout: 300
logLevel: info
metricsMaxInMemory: 1000
sendLoadingState: true

macros:
  macros-docker-proxy: http://host.docker.internal:${PORT}
  macros-docker-stop: docker stop model-${MODEL_ID}
  macros-docker-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /home/spirkaa/.lmstudio/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/llama.cpp:server-cuda
  macros-docker-ik-llama: >
    docker run
      --init --rm
      --name model-${MODEL_ID}
      --gpus all --ipc=host --ulimit memlock=-1
      -v /home/spirkaa/.lmstudio/models:/app/models
      -v /home/spirkaa/projects/llm-homelab/llama-swap/config:/app/config
      -p ${PORT}:8080
      git.devmem.ru/projects/llm-homelab/ik_llama.cpp:server-cuda

groups:
  forever:
    persistent: true
    swap: false
    exclusive: false
    members:
      - qwen3-0.6b

models:
  gemma-3-27b-it-qat:
    # https://unsloth.ai/docs/models/gemma-3-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/gemma-3-27b-it-q4_0.gguf
      --metrics
      --mlock
      --fit-target 3072
      --temp 1.0
      --min-p 0.0
      --top-p 0.95
      --top-k 64
      --mmproj /app/models/google/gemma-3-27b-it-qat-q4_0-gguf/mmproj-model-f16-27B.gguf

  gpt-oss-120b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-120b-GGUF/gpt-oss-120b-UD-Q4_K_XL-00001-of-00002.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --n-cpu-moe 27
      --batch-size 4096
      --ubatch-size 2048
      --ctx-size 100000
      --temp 1.0
      --min-p 0.0
      --top-p 1.0
      --top-k 0.0
      --jinja
      --chat-template-kwargs '{"reasoning_effort": "medium"}'
      --grammar-file /app/config/gpt-oss-vscode.gbnf

  gpt-oss-20b:
    # https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-F16.gguf
      --metrics
      --mlock
      --fit-target 2048
      --temp 1.0
      --min-p 0.0
      --top-p 1.0
      --top-k 0.0
      --jinja
      --chat-template-kwargs '{"reasoning_effort": "medium"}'
      --grammar-file /app/config/gpt-oss-vscode.gbnf

  qwen3-0.6b:
    # https://unsloth.ai/docs/models/qwen3-how-to-run-and-fine-tune
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
    cmd: >
      ${macros-docker-llama}
      --model /app/models/unsloth/Qwen3-0.6B-GGUF/Qwen3-0.6B-UD-Q4_K_XL.gguf
      --metrics
      --mlock
      --n-gpu-layers 99
      --ctx-size 16382
      --cache-type-k q8_0
      --cache-type-v q8_0
      --temp 0.7
      --min-p 0.0
      --top-p 0.8
      --top-k 20
      --jinja
      --threads 4

  qwen3-coder-30b-a3b-instruct:
    # https://unsloth.ai/docs/models/qwen3-coder-how-to-run-locally
    proxy: ${macros-docker-proxy}
    cmdStop: ${macros-docker-stop}
