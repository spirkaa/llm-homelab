      --model /app/models/bartowski/Qwen_Qwen3.5-27B-GGUF/Qwen_Qwen3.5-27B-IQ4_XS.gguf
      --metrics
      --mlock
      --fit-target 1536
      --fit-ctx 65536
      --jinja
      --mmproj /app/models/bartowski/Qwen_Qwen3.5-27B-GGUF/mmproj-Qwen_Qwen3.5-27B-f16.gguf
    aliases:
      - qwen3.5-27b:coding
      - qwen3.5-27b:instruct
      - qwen3.5-27b:instruct-reasoning
    filters:
      setParams:
        temperature: 1.0
        min_p: 0.0
        top_p: 0.95
        top_k: 20
        presence_penalty: 1.5
      setParamsByID:
        "${MODEL_ID}:coding":
          temperature: 0.6
          presence_penalty: 0.0
        "${MODEL_ID}:instruct":
          temperature: 0.7
          top_p: 0.8
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:instruct-reasoning":
          chat_template_kwargs:
            enable_thinking: false

