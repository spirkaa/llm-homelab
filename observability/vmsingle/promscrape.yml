global:
  scrape_interval: 10s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets:
          - traefik:8080

  - job_name: victoriametrics
    static_configs:
      - targets:
          - vmsingle:8428

  - job_name: victorialogs
    static_configs:
      - targets:
          - victorialogs:9428

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: nvitop-exporter
    scrape_interval: 2s
    static_configs:
      - targets:
          - nvitop-exporter:5050

  - job_name: llama-swap-exporter
    scrape_interval: 2s
    static_configs:
      - targets:
          - llama-swap-exporter:8081
